name: megabatako
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  intl: 0.20.3
  money_formatter: ^0.0.7
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  d_method: ^0.2.6
  dartz: ^0.10.1
  get_it: ^8.0.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  device_info_plus: ^13.2.0

dev_dependencies:

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

